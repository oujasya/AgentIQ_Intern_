[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentiq-assessment-solution"
version = "1.0.0"
description = "Integrated answers to all 25 AgentIQ developer assessment tasks"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["agentiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
